      <stop offset="0%" stop-color="#0B0916" />
      <stop offset="100%" stop-color="#16102C" />
    </linearGradient>
    <linearGradient id="userMsgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="asstMsgG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1435" />
      <stop offset="100%" stop-color="#120D25" />
