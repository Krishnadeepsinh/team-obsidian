  <!-- Window Header Bar -->
  <rect width="1200" height="42" rx="16" fill="#110D24" />
  <circle cx="28" cy="21" r="5.5" fill="#EF4444" />
  <circle cx="46" cy="21" r="5.5" fill="#F59E0B" />
  <circle cx="64" cy="21" r="5.5" fill="#10B981" />
  <rect x="350" y="9" width="500" height="24" rx="6" fill="#1C153A" />
  <text x="530" y="25" font-family="sans-serif" font-size="11" fill="#94A3B8">https://app.team-obsidian.io/assistant</text>

  <!-- Left Sidebar (Saved Threads) -->
  <g transform="translate(24, 60)">
    <rect width="260" height="675" rx="14" fill="#130E29" stroke="#251A46" stroke-width="1.2" />
    <text x="20" y="32" font-family="sans-serif" font-size="11" font-weight="700" fill="#A78BFA" letter-spacing="1">SAVED THREADS</text>
    <rect x="215" y="18" width="24" height="18" rx="9" fill="#2E1C59" />
    <text x="223" y="31" font-family="sans-serif" font-size="10" font-weight="700" fill="#DDD6FE">3</text>

    <!-- Thread 1: Active -->
    <g transform="translate(14, 52)">
      <rect width="232" height="64" rx="10" fill="#2A1B54" stroke="#7C3AED" stroke-width="1.2" />
      <text x="14" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Repository Architecture &amp; C...</text>
      <text x="14" y="44" font-family="sans-serif" font-size="10" fill="#C4B5FD">3 msgs • obsidian-lead</text>
    </g>

    <!-- Thread 2 -->
    <g transform="translate(14, 126)">
      <rect width="232" height="64" rx="10" fill="#191333" />
      <text x="14" y="24" font-family="sans-serif" font-size="12" font-weight="600" fill="#CBD5E1">Stripe Webhook Risk Mitigati...</text>
      <text x="14" y="44" font-family="sans-serif" font-size="10" fill="#64748B">5 msgs • checkout-api</text>
    </g>

    <!-- Thread 3 -->
    <g transform="translate(14, 200)">
      <rect width="232" height="64" rx="10" fill="#191333" />
      <text x="14" y="24" font-family="sans-serif" font-size="12" font-weight="600" fill="#CBD5E1">Database RLS &amp; Supabase ...</text>
      <text x="14" y="44" font-family="sans-serif" font-size="10" fill="#64748B">2 msgs • auth-service</text>
    </g>
  </g>

  <!-- Main Chat Stream Area (Right) -->
  <g transform="translate(304, 60)">
    <!-- Header -->
    <rect width="872" height="54" rx="12" fill="#15102D" stroke="#251A46" stroke-width="1.2" />
    <text x="20" y="32" font-family="sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">AI Knowledge Assistant</text>
    <text x="205" y="32" font-family="sans-serif" font-size="11" fill="#94A3B8">• Multi-Turn Query Orchestrator &amp; Dynamic Grounding</text>
    <rect x="740" y="14" width="112" height="26" rx="8" fill="#7C3AED" />
    <text x="754" y="31" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">+ New Thread</text>

    <!-- Turn 1: User Question -->
    <g transform="translate(480, 75)">
      <rect width="392" height="42" rx="14" fill="url(#userMsgG)" />
      <text x="20" y="26" font-family="sans-serif" font-size="13" font-weight="500" fill="#FFFFFF">how many repo are there in my github</text>
    </g>

    <!-- Turn 1: Assistant Response (Level 1: Simple Answer) -->
    <g transform="translate(0, 130)">
      <rect width="872" height="185" rx="14" fill="url(#asstMsgG)" stroke="#2B1F4F" stroke-width="1.2" />

      <!-- Top Status Row -->
      <g transform="translate(20, 16)">
        <rect width="156" height="24" rx="12" fill="#064E3B" stroke="#059669" stroke-width="1" />
        <circle cx="14" cy="12" r="3.5" fill="#34D399" />
        <text x="26" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#A7F3D0">Direct Source Verified</text>

        <rect x="170" y="0" width="155" height="24" rx="12" fill="#2E1C59" />
        <text x="184" y="16" font-family="sans-serif" font-size="10" font-weight="600" fill="#DDD6FE">⚡ Obsidian Intelligence</text>

        <!-- ADR promotion buttons -->
        <rect x="670" y="0" width="86" height="24" rx="6" fill="#1E173E" stroke="#37275E" />
        <text x="680" y="16" font-family="sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">⚖️ Save ADR</text>
        <rect x="765" y="0" width="86" height="24" rx="6" fill="#1E173E" stroke="#37275E" />
        <text x="778" y="16" font-family="sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">❓ Log Gap</text>
      </g>

      <!-- Answer Content -->
      <text x="24" y="72" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">You have <tspan fill="#A78BFA">3 GitHub repositories</tspan> connected:</text>
      <text x="24" y="98" font-family="sans-serif" font-size="13" fill="#E2E8F0">• <tspan font-weight="700">Public</tspan>: 2</text>
      <text x="24" y="118" font-family="sans-serif" font-size="13" fill="#E2E8F0">• <tspan font-weight="700">Private</tspan>: 1</text>
      <text x="24" y="142" font-family="sans-serif" font-size="12" fill="#94A3B8">Connected account: <tspan font-family="monospace" fill="#DDD6FE">@obsidian-lead</tspan> | Last synchronised: 13 November 2026</text>

      <!-- Bottom Source Attribution -->
      <line x1="20" y1="156" x2="852" y2="156" stroke="#231A43" stroke-width="1" />
      <text x="24" y="174" font-family="sans-serif" font-size="11" fill="#64748B">🛡️ Source: <tspan font-weight="600" fill="#94A3B8">Connected GitHub Account (@obsidian-lead)</tspan></text>
    </g>

    <!-- Turn 2: User Follow-up Question -->
    <g transform="translate(430, 332)">
      <rect width="442" height="42" rx="14" fill="url(#userMsgG)" />
      <text x="20" y="26" font-family="sans-serif" font-size="13" font-weight="500" fill="#FFFFFF">Analyse my repository architecture and risks.</text>
    </g>

    <!-- Turn 2: Assistant Response (Level 3: Deep Architecture Analysis) -->
    <g transform="translate(0, 386)">
      <rect width="872" height="280" rx="14" fill="url(#asstMsgG)" stroke="#2B1F4F" stroke-width="1.2" />

      <!-- Status Row -->
      <g transform="translate(20, 16)">
        <rect width="168" height="24" rx="12" fill="#064E3B" stroke="#059669" stroke-width="1" />
        <circle cx="14" cy="12" r="3.5" fill="#34D399" />
        <text x="26" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#A7F3D0">Evidence Grounded (96%)</text>

        <rect x="180" y="0" width="155" height="24" rx="12" fill="#2E1C59" />
        <text x="194" y="16" font-family="sans-serif" font-size="10" font-weight="600" fill="#DDD6FE">⚡ Obsidian Intelligence</text>
      </g>

      <!-- Structured Markdown -->
      <text x="24" y="68" font-family="sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Architectural Topology &amp; System Analysis</text>
      <text x="24" y="92" font-family="sans-serif" font-size="12" fill="#CBD5E1">The platform operates as a distributed system across <tspan font-weight="700" fill="#A78BFA">3 primary repositories</tspan> coordinating:</text>

      <text x="24" y="118" font-family="sans-serif" font-size="12" fill="#94A3B8">• <tspan font-weight="700" fill="#FFFFFF">Client Presentation (Next.js 16)</tspan>: Server and client-rendered dashboard with SSE live streaming.</text>
      <text x="24" y="138" font-family="sans-serif" font-size="12" fill="#94A3B8">• <tspan font-weight="700" fill="#FFFFFF">API Orchestrator (FastAPI / Python 3.11)</tspan>: Async REST services, Argon2id auth, and tenant isolation.</text>
      <text x="24" y="158" font-family="sans-serif" font-size="12" fill="#94A3B8">• <tspan font-weight="700" fill="#FFFFFF">Vector &amp; Relational (Supabase / pgvector)</tspan>: Unified models, Knowledge Graph, and hybrid RAG search.</text>

      <!-- Collapsible Evidence Disclosure Card -->
      <g transform="translate(20, 180)">
        <rect width="832" height="42" rx="8" fill="#1C153A" stroke="#3A2768" stroke-width="1" />
        <text x="16" y="26" font-family="sans-serif" font-size="11" font-weight="700" fill="#C4B5FD">🛡️ SUPPORTING EVIDENCE CITATIONS (4) — [CLICK TO EXPAND] ▾</text>
        <rect x="730" y="9" width="90" height="24" rx="6" fill="#2A1B54" />
        <text x="742" y="25" font-family="sans-serif" font-size="10" font-weight="600" fill="#E9D5FF">View Sources</text>
      </g>

      <!-- Suggested Follow-ups -->
      <g transform="translate(20, 238)">
        <rect x="0" y="0" width="220" height="28" rx="14" fill="#201740" stroke="#3E2A74" stroke-width="1" />
        <text x="14" y="18" font-family="sans-serif" font-size="11" fill="#DDD6FE">→ What are the biggest project risks?</text>

        <rect x="230" y="0" width="250" height="28" rx="14" fill="#201740" stroke="#3E2A74" stroke-width="1" />
        <text x="244" y="18" font-family="sans-serif" font-size="11" fill="#DDD6FE">→ Generate a complete project handover</text>
      </g>
    </g>

    <!-- Bottom Input Box -->
    <g transform="translate(0, 680)">
      <rect width="872" height="48" rx="14" fill="#181232" stroke="#312258" stroke-width="1.2" />
      <text x="20" y="30" font-family="sans-serif" font-size="13" fill="#64748B">Ask a technical question about architecture, risks, ownership, or handovers...</text>
      <circle cx="842" cy="24" r="16" fill="#7C3AED" />
      <text x="836" y="30" font-family="sans-serif" font-size="14" fill="#FFFFFF">↑</text>
    </g>
