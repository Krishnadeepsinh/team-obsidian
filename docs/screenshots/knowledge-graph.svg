<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0815" />
      <stop offset="100%" stop-color="#140F27" />
    </linearGradient>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#bgG2)" stroke="#2B1D4F" stroke-width="2" />

  <!-- Window Header Bar -->
  <rect width="1200" height="42" rx="16" fill="#100C21" />
  <circle cx="28" cy="21" r="5.5" fill="#EF4444" />
  <circle cx="46" cy="21" r="5.5" fill="#F59E0B" />
  <circle cx="64" cy="21" r="5.5" fill="#10B981" />
  <rect x="350" y="9" width="500" height="24" rx="6" fill="#1A1336" />
  <text x="525" y="25" font-family="sans-serif" font-size="11" fill="#94A3B8">https://app.team-obsidian.io/knowledge/graph</text>

  <!-- Control Header -->
  <g transform="translate(36, 60)">
    <text x="0" y="24" font-family="sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Interactive Knowledge Graph &amp; Blast Radius</text>
    <text x="0" y="44" font-family="sans-serif" font-size="12" fill="#94A3B8">Visual entity mapping, SPOF single-point-of-failure detection, and architectural ownership dependencies</text>

    <!-- Filter Pills -->
    <rect x="800" y="8" width="85" height="28" rx="8" fill="#7C3AED" />
    <text x="815" y="26" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">All Nodes</text>

    <rect x="895" y="8" width="115" height="28" rx="8" fill="#1E173E" stroke="#3D2970" />
    <text x="910" y="26" font-family="sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">SPOF Risks (2)</text>

    <rect x="1020" y="8" width="100" height="28" rx="8" fill="#1E173E" stroke="#3D2970" />
    <text x="1035" y="26" font-family="sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Blast Radius</text>
  </g>

  <!-- Graph Canvas Area -->
  <g transform="translate(36, 120)">
    <rect width="1128" height="520" rx="14" fill="#0E0B1D" stroke="#261A46" stroke-width="1.2" />

    <!-- Graph Grid Lines -->
    <g stroke="#261A46" stroke-width="1" stroke-dasharray="4,8" opacity="0.4">
      <line x1="0" y1="130" x2="1128" y2="130" />
      <line x1="0" y1="260" x2="1128" y2="260" />
      <line x1="0" y1="390" x2="1128" y2="390" />
      <line x1="282" y1="0" x2="282" y2="520" />
      <line x1="564" y1="0" x2="564" y2="520" />
      <line x1="846" y1="0" x2="846" y2="520" />
    </g>

    <!-- Graph Edges / Connections -->
    <g stroke-width="2" opacity="0.65">
      <!-- Edge: Sarah Chen -> Trustify -->
      <line x1="240" y1="160" x2="480" y2="220" stroke="#8B5CF6" />
      <!-- Edge: Alex Rivera -> core-api -->
      <line x1="240" y1="360" x2="480" y2="300" stroke="#8B5CF6" />
      <!-- Edge: Trustify -> Supabase DB -->
      <line x1="480" y1="220" x2="780" y2="180" stroke="#10B981" />
      <!-- Edge: core-api -> Supabase DB -->
      <line x1="480" y1="300" x2="780" y2="180" stroke="#10B981" />
      <!-- Edge: core-api -> pgvector -->
      <line x1="480" y1="300" x2="780" y2="340" stroke="#3B82F6" />
      <!-- Edge: Trustify -> Stripe Webhook (SPOF!) -->
      <line x1="480" y1="220" x2="780" y2="440" stroke="#F43F5E" stroke-dasharray="6,4" stroke-width="2.5" />
    </g>

    <!-- Node 1: Person (Sarah Chen) -->
    <g transform="translate(160, 130)">
      <rect width="160" height="60" rx="12" fill="#1E163B" stroke="#8B5CF6" stroke-width="1.5" />
      <circle cx="28" cy="30" r="14" fill="#6D28D9" />
      <text x="24" y="35" font-family="sans-serif" font-size="12" fill="#FFFFFF">👤</text>
      <text x="52" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Sarah Chen</text>
      <text x="52" y="44" font-family="sans-serif" font-size="10" fill="#C4B5FD">Lead Architect</text>
    </g>

    <!-- Node 2: Person (Alex Rivera) -->
    <g transform="translate(160, 330)">
      <rect width="160" height="60" rx="12" fill="#1E163B" stroke="#8B5CF6" stroke-width="1.5" />
      <circle cx="28" cy="30" r="14" fill="#6D28D9" />
      <text x="24" y="35" font-family="sans-serif" font-size="12" fill="#FFFFFF">👤</text>
      <text x="52" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Alex Rivera</text>
      <text x="52" y="44" font-family="sans-serif" font-size="10" fill="#C4B5FD">Senior Backend</text>
    </g>

    <!-- Node 3: Component (Trustify) -->
    <g transform="translate(430, 190)">
      <rect width="170" height="65" rx="12" fill="#181335" stroke="#A78BFA" stroke-width="2" />
      <circle cx="30" cy="32" r="14" fill="#4C1D95" />
      <text x="24" y="37" font-family="sans-serif" font-size="12" fill="#FFFFFF">📦</text>
      <text x="54" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Trustify Web</text>
      <text x="54" y="46" font-family="sans-serif" font-size="10" fill="#94A3B8">Next.js 16 • 24 ADRs</text>
    </g>

    <!-- Node 4: Component (core-api) -->
    <g transform="translate(430, 270)">
      <rect width="170" height="65" rx="12" fill="#181335" stroke="#A78BFA" stroke-width="2" />
      <circle cx="30" cy="32" r="14" fill="#4C1D95" />
      <text x="24" y="37" font-family="sans-serif" font-size="12" fill="#FFFFFF">⚙️</text>
      <text x="54" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Core API</text>
      <text x="54" y="46" font-family="sans-serif" font-size="10" fill="#94A3B8">FastAPI • Python 3.11</text>
    </g>

    <!-- Node 5: Service (Supabase DB) -->
    <g transform="translate(730, 150)">
      <rect width="180" height="65" rx="12" fill="#0E231F" stroke="#10B981" stroke-width="1.5" />
      <circle cx="30" cy="32" r="14" fill="#065F46" />
      <text x="24" y="37" font-family="sans-serif" font-size="12" fill="#FFFFFF">🗄️</text>
      <text x="54" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Supabase DB</text>
      <text x="54" y="46" font-family="sans-serif" font-size="10" fill="#6EE7B7">Postgres • RLS Guarded</text>
    </g>

    <!-- Node 6: Technology (pgvector) -->
    <g transform="translate(730, 310)">
      <rect width="180" height="65" rx="12" fill="#101C38" stroke="#3B82F6" stroke-width="1.5" />
      <circle cx="30" cy="32" r="14" fill="#1E40AF" />
      <text x="24" y="37" font-family="sans-serif" font-size="12" fill="#FFFFFF">🔍</text>
      <text x="54" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">pgvector HNSW</text>
      <text x="54" y="46" font-family="sans-serif" font-size="10" fill="#93C5FD">384-dim Embeddings</text>
    </g>

    <!-- Node 7: SPOF Risk Node (Stripe Webhook) -->
    <g transform="translate(730, 410)">
      <rect width="210" height="70" rx="12" fill="#310D1B" stroke="#F43F5E" stroke-width="2" filter="url(#nodeGlow)" />
      <circle cx="30" cy="35" r="14" fill="#9F1239" />
      <text x="24" y="40" font-family="sans-serif" font-size="12" fill="#FFFFFF">⚠️</text>
      <text x="54" y="30" font-family="sans-serif" font-size="13" font-weight="800" fill="#FECDD3">Stripe Webhook</text>
      <text x="54" y="48" font-family="sans-serif" font-size="10" font-weight="700" fill="#FB7185">CRITICAL SPOF RISK</text>
      <text x="54" y="60" font-family="sans-serif" font-size="9" fill="#FDA4AF">Blast Radius: High • Single Owner</text>
    </g>

    <!-- Legend Overlay -->
    <g transform="translate(940, 20)">
      <rect width="170" height="110" rx="10" fill="#140F2A" stroke="#2F2054" stroke-width="1" />
      <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#DDD6FE">LEGEND</text>
      <circle cx="20" cy="40" r="4" fill="#8B5CF6" />
      <text x="32" y="44" font-family="sans-serif" font-size="10" fill="#CBD5E1">Person / Team</text>
      <circle cx="20" cy="60" r="4" fill="#A78BFA" />
      <text x="32" y="64" font-family="sans-serif" font-size="10" fill="#CBD5E1">Repository / Component</text>
      <circle cx="20" cy="80" r="4" fill="#10B981" />
      <text x="32" y="84" font-family="sans-serif" font-size="10" fill="#CBD5E1">Database / Service</text>
      <circle cx="20" cy="100" r="4" fill="#F43F5E" />
      <text x="32" y="104" font-family="sans-serif" font-size="10" fill="#CBD5E1">SPOF Danger Area</text>
    </g>
  </g>
</svg>
