<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090714" />
      <stop offset="50%" stop-color="#120D24" />
      <stop offset="100%" stop-color="#07050E" />
    </linearGradient>
    <linearGradient id="mesh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#D946EF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <filter id="bloom">
      <feGaussianBlur stdDeviation="16" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Void Background -->
  <rect width="1280" height="420" rx="24" fill="url(#bg)" />
  <rect width="1280" height="420" rx="24" fill="url(#mesh)" />

  <!-- Subtle Cyber Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="70" x2="1280" y2="70" />
    <line x1="0" y1="140" x2="1280" y2="140" />
    <line x1="0" y1="210" x2="1280" y2="210" />
    <line x1="0" y1="280" x2="1280" y2="280" />
    <line x1="0" y1="350" x2="1280" y2="350" />
    <line x1="160" y1="0" x2="160" y2="420" />
    <line x1="320" y1="0" x2="320" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="640" y1="0" x2="640" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1120" y1="0" x2="1120" y2="420" />
  </g>

  <!-- Brand Emblem (Left Center) -->
  <g transform="translate(100, 110)">
    <!-- Ambient Aura -->
    <circle cx="100" cy="100" r="90" fill="#7C3AED" opacity="0.3" filter="url(#bloom)" />

    <!-- Gem Outer Squircle -->
    <rect x="15" y="15" width="170" height="170" rx="42" fill="#140E2A" stroke="url(#glowG)" stroke-width="3" />

    <!-- Obsidian Gem Facets -->
    <g transform="translate(15, 12)">
      <polygon points="85,30 120,65 85,85 50,65" fill="#E9D5FF" opacity="0.9" />
      <polygon points="85,30 50,65 28,100 60,95" fill="#7C3AED" />
      <polygon points="85,30 120,65 142,100 110,95" fill="#C084FC" />
      <polygon points="50,65 120,65 110,95 85,110 60,95" fill="#4C1D95" />
      <polygon points="85,110 110,95 85,155 60,95" fill="url(#crystal)" />
      <polygon points="28,100 60,95 85,155" fill="#311042" />
      <polygon points="142,100 110,95 85,155" fill="#4C1D95" />
      <!-- Top spark -->
      <circle cx="85" cy="30" r="3.5" fill="#FFFFFF" filter="url(#bloom)" />
      <!-- Center node -->
      <circle cx="85" cy="85" r="3" fill="#38BDF8" filter="url(#bloom)" />
    </g>
  </g>

  <!-- Typography & Headers -->
  <g transform="translate(350, 130)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="280" height="30" rx="15" fill="#7C3AED" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4" fill="#34D399" />
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#E9D5FF" letter-spacing="1.5">ENTERPRISE KNOWLEDGE PLATFORM</text>

    <!-- Main Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      TEAM <tspan fill="url(#glowG)">OBSIDIAN</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#CBD5E1">
      Autonomous Knowledge Reconstruction &amp; 16-Section Handover Dossier Engine
    </text>

    <!-- Value Prop Tags -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="135" height="32" rx="8" fill="#1E163B" stroke="#6D28D9" stroke-width="1" />
      <text x="14" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#DDD6FE">⚡ Groq Llama-3.3</text>

      <rect x="145" y="0" width="145" height="32" rx="8" fill="#1E163B" stroke="#6D28D9" stroke-width="1" />
      <text x="159" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#DDD6FE">🧠 pgvector RAG</text>

      <rect x="300" y="0" width="165" height="32" rx="8" fill="#1E163B" stroke="#6D28D9" stroke-width="1" />
      <text x="314" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#DDD6FE">🕸️ Knowledge Graph</text>

      <rect x="475" y="0" width="170" height="32" rx="8" fill="#1E163B" stroke="#6D28D9" stroke-width="1" />
      <text x="489" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#DDD6FE">📋 16-Section Dossiers</text>
    </g>
  </g>
</svg>
