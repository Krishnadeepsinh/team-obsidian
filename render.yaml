# Render Blueprint for TEAM OBSIDIAN Backend API
# Docs: https://render.com/docs/blueprint-spec
# Upgrade `plan` to `starter` (1GB+ RAM) if BAAI/bge-small-en-v1.5 embeddings + PDF generation exceed 512MB RAM.

services:
  - type: web
    name: team-obsidian-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PRIMARY_LLM
        value: gemini-3.5-flash
      - key: SECONDARY_LLM
        value: gemini-3.5-flash-lite
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_DIMENSIONS
        value: "384"
      - key: SECRET_KEY
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # Fill these URLs once Render (backend) and Vercel (frontend) live URLs are assigned
      - key: BACKEND_URL
        value: ""
      - key: FRONTEND_URL
        value: ""
      - key: CORS_ORIGINS
        value: ""
      # Optional live OAuth / API connector credentials
      - key: NANGO_API_KEY
        value: dba9fdd3-c077-4743-a2f5-3565d2a7be63
      - key: NANGO_BASE_URL
        value: https://api.nango.dev
      - key: NANGO_SLACK_INTEGRATION_ID
        value: slack
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_TEAM_ID
        sync: false
      - key: NOTION_CLIENT_ID
        sync: false
      - key: NOTION_CLIENT_SECRET
        sync: false
      - key: NOTION_API_KEY
        sync: false
      # Enterprise Platform Connector Credentials for Live Demo & Production
      - key: ATLASSIAN_EMAIL
        value: "team.obsidian44@gmail.com"
      - key: ATLASSIAN_SITE_URL
        value: "https://teamobsidian44.atlassian.net"
      - key: JIRA_SITE_URL
        value: "https://teamobsidian44.atlassian.net"
      - key: JIRA_EMAIL
        value: "team.obsidian44@gmail.com"
      - key: JIRA_API_TOKEN
        sync: false
      - key: CONFLUENCE_SITE_URL
        value: "https://teamobsidian44.atlassian.net"
      - key: CONFLUENCE_EMAIL
        value: "team.obsidian44@gmail.com"
      - key: CONFLUENCE_API_TOKEN
        sync: false
      - key: LINEAR_API_TOKEN
        sync: false
      - key: GITLAB_TOKEN
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SENTRY_ORG_SLUG
        value: "team-obsidian"
      # Optional email delivery for password resets & invitations
      - key: RESEND_API_KEY
        value: ""
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: SMTP_FROM_EMAIL
        value: noreply@teamobsidian.local
