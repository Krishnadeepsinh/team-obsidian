<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0914" />
      <stop offset="50%" stop-color="#16102B" />
      <stop offset="100%" stop-color="#08070D" />
    </linearGradient>

    <!-- Outer Rim Glow -->
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#D946EF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Obsidian Top Facet -->
    <linearGradient id="facetTop" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="40%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <!-- Obsidian Left Upper Facet -->
    <linearGradient id="facetLeftUp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Obsidian Right Upper Facet -->
    <linearGradient id="facetRightUp" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Obsidian Center Core Facet -->
    <linearGradient id="facetCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="40%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#1E0E3E" />
    </linearGradient>

    <!-- Obsidian Lower Left Facet -->
    <linearGradient id="facetLeftLow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#0F0826" />
    </linearGradient>

    <!-- Obsidian Lower Right Facet -->
    <linearGradient id="facetRightLow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#140727" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base with Cyber Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#rimGlow)" stroke-width="8" />

  <!-- Ambient Internal Bloom Glow -->
  <circle cx="256" cy="256" r="140" fill="#7C3AED" opacity="0.32" filter="url(#glow)" />

  <!-- Faceted Geometric Obsidian Crystal -->
  <g transform="translate(0, 8)">
    <!-- Top Central Apex -->
    <polygon points="256,92 344,178 256,224 168,178" fill="url(#facetTop)" opacity="0.95" />

    <!-- Upper Left Wing -->
    <polygon points="256,92 168,178 116,256 188,244" fill="url(#facetLeftUp)" />

    <!-- Upper Right Wing -->
    <polygon points="256,92 344,178 396,256 324,244" fill="url(#facetRightUp)" />

    <!-- Center Gem Facet -->
    <polygon points="168,178 344,178 324,244 256,280 188,244" fill="url(#facetCenter)" />

    <!-- Lower Center Keel Facet -->
    <polygon points="256,280 324,244 256,412 188,244" fill="url(#facetTop)" opacity="0.85" />

    <!-- Bottom Left Spike -->
    <polygon points="116,256 188,244 256,412" fill="url(#facetLeftLow)" />

    <!-- Bottom Right Spike -->
    <polygon points="396,256 324,244 256,412" fill="url(#facetRightLow)" />

    <!-- Crystal Facet Edges & Light Glints -->
    <polyline points="256,92 256,224 256,280 256,412" fill="none" stroke="#E9D5FF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <polyline points="116,256 188,244 256,280 324,244 396,256" fill="none" stroke="#C084FC" stroke-width="2.5" opacity="0.75" />
    <polyline points="168,178 256,224 344,178" fill="none" stroke="#F3E8FF" stroke-width="3" opacity="0.9" />

    <!-- Top Apex Glint Sparkle -->
    <circle cx="256" cy="92" r="6" fill="#FFFFFF" filter="url(#glow)" />
    <polygon points="256,76 259,89 272,92 259,95 256,108 253,95 240,92 253,89" fill="#FFFFFF" opacity="0.9" />

    <!-- Center Core Energy Node -->
    <circle cx="256" cy="224" r="5" fill="#38BDF8" filter="url(#glow)" />
  </g>
</svg>
